name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      run: msbuild SocksDesktopPrivacyManager.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SocksDesktopPrivacyManager-EXE
        path: bin/Release/SocksDesktopPrivacyManager.exe
